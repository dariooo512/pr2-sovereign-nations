-- ==========================================================================
-- found-new-nation (FNN). The first line above is the unchanged vanilla
-- content of this file; everything below is added by the mod.
--
-- Lua 4 (lua.dll "4.1.0 ASCARON_LUA"): no '#', no pairs(), no 'local
-- function', numbers are int32. Every Lua error in the Missions state is
-- fatal (the engine's _ERRORMESSAGE throws), so the callbacks below are
-- trivial and all real logic runs through FNN_Guard (PR2Nation.dll), which
-- calls it with a harmless error handler. Without the DLL the callbacks do
-- nothing. The DLL creates the single mission instance (GLOBALS.FNN_MISSION).
-- ==========================================================================

FNN_SCRIPT = 1
FNN_MENU_ID = 20033

-- add our group to USE_GROUPS (iterated 1,2,3.. by CMission::LoadScriptPath)
fnn_i = 1
while USE_GROUPS[fnn_i] ~= nil do
  fnn_i = fnn_i + 1
end
USE_GROUPS[fnn_i] = "fnn"
fnn_i = nil

-- Script_Register returns SCRIPT_TABLE["fnn_nation"]; the engine looks every
-- callback up in that table (CMission::_CreateVTbl), so define them on it.
fnn_nation = Script_Register("fnn_nation", "fnn", MTYPE_GLOBAL)

-- The nation's menu is the in-game panel (PR2Nation.dll, dll/panel.c). This script only
-- keeps the popups for binary choices and notifications: the conquest decision
-- (Annex / Withdraw) and its result. Anything else that reaches the menu event opens
-- the panel.
FNN_P_INFO = 6
FNN_P_CONQUEST = 10

-- ---- engine callbacks (keep trivial) -------------------------------------

-- Called once at creation, without mission context; must return a non-zero
-- number or the mission is not created.
function fnn_nation:OnInit()
  return 1
end

function fnn_nation:OnCreate()
  self.FnnPage = 0
  Global_InstallEventFilter(MEVENT_GAME_MENU + MEVENT_TOWNBATTLE_END)
end

function fnn_nation:OnDestroy()
end

function fnn_nation:OnTimer(a, b)
end

function fnn_nation:OnGameMenu(menu, sub, opened, p4, p5)
  if menu == FNN_MENU_ID and FNN_Guard ~= nil then
    FNN_Guard("fnn_on_menu", self, menu, sub, opened, p4, p5)
  end
end

function fnn_nation:OnTownBattleEnd(t)
  if FNN_Guard ~= nil then
    FNN_Guard("fnn_on_battle", self, t)
  end
end

function fnn_nation:OnPopupText(id)
  local h, b, k
  if FNN_Guard ~= nil then
    h, b, k = FNN_Guard("fnn_popup_text", self)
  end
  if h == nil or b == nil or k == nil then
    return "IDM_FNN_HDR_INFO", { "IDM_FNN_TXT_ERROR" }, { "IDM_FNN_BTN_CLOSE" }
  end
  return h, b, k
end

function fnn_nation:OnPopupClose(id, btn)
  if FNN_Guard ~= nil then
    FNN_Guard("fnn_popup_close", self, btn)
  end
end

-- ---- helpers (run inside FNN_Guard) --------------------------------------

function fnn_log(a, b, c)
  if Nation_Log ~= nil then
    Nation_Log(a, b, c)
  end
end

function fnn_open(self, page)
  self.FnnPage = page
  Global_CreatePopup()
end

-- a notification with one button
function fnn_info_page(self, text)
  Nation_SetText("IDM_FNN_INFO_BODY", text)
  fnn_open(self, FNN_P_INFO)
end

function fnn_get_info()
  local f, name, adj, cap, treasury, stab, towns, tax, tariff = Nation_GetInfo()
  return { founded = f, name = name, adj = adj, capital = cap, treasury = treasury,
           stab = stab, towns = towns, tax = tax, tariff = tariff }
end

-- the town the player is in: the open town view, else the selected convoy's town
-- (the panel's founding page asks for it)
function fnn_current_town()
  local h = Global_GetViewTown()
  if h == nil or h == -1 then
    local c = Global_GetSelectedConvoy()
    if c ~= nil and c ~= -1 then
      h = Convoy_GetTown(c)
    end
  end
  if h == nil or h == -1 then
    return -1
  end
  return Nation_TownIndex(h)
end

-- ---- handlers ------------------------------------------------------------

-- sub >= FNN_CONQUEST_SUB: the DLL reports a conquest ready for a decision
-- (town = sub - FNN_CONQUEST_SUB); any other menu event opens the panel.
FNN_CONQUEST_SUB = 1000

function fnn_on_menu(self, menu, sub, opened, p4, p5)
  if sub ~= nil and sub >= FNN_CONQUEST_SUB then
    self.FnnConquest = sub - FNN_CONQUEST_SUB
    fnn_open(self, FNN_P_CONQUEST)
    return
  end
  Nation_PanelOpen(-1)
end

-- The conquest popup is opened by the DLL once its battle hooks have
-- recorded a won war battle and the battle has ended (see fnn_on_menu): the
-- town-battle-end event does not reach this script on every battle path.
function fnn_on_battle(self, t)
end

function fnn_popup_text(self)
  local p = self.FnnPage
  if p == FNN_P_INFO then
    return "IDM_FNN_HDR_INFO", { "IDM_FNN_INFO_BODY" }, { "IDM_FNN_BTN_CLOSE" }
  elseif p == FNN_P_CONQUEST then
    local n = fnn_get_info()
    local l = FNN_TownLabel(self.FnnConquest)
    Nation_SetText("IDM_FNN_BODY", "Your forces have taken " .. l .. ".<n><n>Annex it to the " .. n.name ..
                   ", or withdraw and leave it to its former sovereign?")
    return "IDM_FNN_HDR_CONQUEST", { "IDM_FNN_BODY" }, { "IDM_FNN_BTN_ANNEX", "IDM_FNN_BTN_WITHDRAW" }
  end
  return "IDM_FNN_HDR_INFO", { "IDM_FNN_TXT_ERROR" }, { "IDM_FNN_BTN_CLOSE" }
end

-- Buttons are 0-based. The decision with consequences sits on button 0, so a
-- 1-based engine index could never trigger it by accident.
function fnn_popup_close(self, btn)
  local p = self.FnnPage
  self.FnnPage = 0
  fnn_log("FNN popup close", p, btn)
  if p == nil or btn == nil then
    return
  end
  if p == FNN_P_CONQUEST then
    local idx = self.FnnConquest
    local l = FNN_TownLabel(idx)
    if btn == 0 then
      -- the conquest recorded by the DLL's battle hooks (only wars count)
      Nation_ResolveConquest(1, idx)
      local n = fnn_get_info()
      if Nation_GetTown(idx) == 1 then
        fnn_info_page(self, l .. " now belongs to the " .. n.name .. ".")
      else
        fnn_info_page(self, l .. " could not be annexed.")
      end
    else
      Nation_ResolveConquest(0, idx)
    end
  end
end
